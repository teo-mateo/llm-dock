<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-Dock Login</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #111827; color: #e5e7eb;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; margin: 1rem; padding: 2rem;
    background: #1f2937; border: 1px solid #374151; border-radius: 0.75rem;
  }
  h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
  .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid #4b5563; }
  .tab {
    flex: 1; padding: 0.5rem 0; background: none; border: 0;
    border-bottom: 2px solid transparent; color: #9ca3af;
    font: inherit; font-size: 0.875rem; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: #f9fafb; border-bottom-color: #3b82f6; }
  label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; }
  input {
    width: 100%; padding: 0.625rem 0.75rem; background: #111827; color: #f9fafb;
    border: 1px solid #4b5563; border-radius: 0.375rem; font: inherit;
  }
  input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
  .row { display: flex; gap: 0.5rem; }
  .row input { flex: 1; }
  button.primary, button.secondary {
    padding: 0.625rem 0.75rem; border: 0; border-radius: 0.375rem;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary { width: 100%; margin-top: 1rem; background: #2563eb; color: #fff; }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.secondary { background: #374151; color: #e5e7eb; }
  .error { margin: 0.75rem 0 0; color: #f87171; font-size: 0.875rem; }
  .hidden { display: none; }
  .hint { margin-top: 1rem; color: #6b7280; font-size: 0.75rem; }
</style>
</head>
<body>
<main class="card">
  <h1>LLM-Dock Login</h1>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-password" role="tab" aria-selected="true" aria-controls="panel-password" type="button">Password</button>
    <button class="tab" id="tab-totp" role="tab" aria-selected="false" aria-controls="panel-totp" type="button">Authenticator</button>
  </div>
  <form id="password-form">
    <div id="panel-password" role="tabpanel" aria-labelledby="tab-password">
      <label for="password">Password</label>
      <div class="row">
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        <button class="secondary" id="toggle-password" type="button" aria-label="Show password">Show</button>
      </div>
      <button class="primary" type="submit">Sign in</button>
    </div>
  </form>
  <form id="totp-form" class="hidden">
    <div id="panel-totp" role="tabpanel" aria-labelledby="tab-totp">
      <label for="totp">6-digit code</label>
      <input id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      <button class="primary" type="submit">Sign in</button>
    </div>
  </form>
  <p id="error" class="error hidden" role="alert"></p>
  <p class="hint">The password is the dashboard token from <code>dashboard/.env</code>.</p>
</main>
<script>
(function () {
  var API = "/api";
  var TOKEN_KEY = "dashboard_token";
  var errorEl = document.getElementById("error");
  var passwordForm = document.getElementById("password-form");
  var totpForm = document.getElementById("totp-form");
  var passwordInput = document.getElementById("password");
  var totpInput = document.getElementById("totp");
  var toggle = document.getElementById("toggle-password");

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.remove("hidden");
  }

  function clearError() {
    errorEl.textContent = "";
    errorEl.classList.add("hidden");
  }

  function setBusy(form, busy) {
    var button = form.querySelector("button.primary");
    if (button) button.disabled = busy;
  }

  function target() {
    if (window.location.pathname !== "/login") return null;
    var raw = new URLSearchParams(window.location.search).get("redirect");
    if (!raw) return "/v2";
    try {
      var url = new URL(raw, window.location.origin);
      if (url.origin !== window.location.origin) return "/v2";
      if (url.pathname === "/login") return "/v2";
      return url.pathname + url.search + url.hash;
    } catch (error) {
      return "/v2";
    }
  }

  function finish(token) {
    localStorage.setItem(TOKEN_KEY, token);
    var next = target();
    if (next === null) window.location.reload();
    else window.location.replace(next);
  }

  function post(url, headers) {
    return fetch(url, { method: "POST", headers: headers }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (!response.ok) throw new Error(data.error || "Login failed");
        return data;
      });
    });
  }

  passwordForm.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();
    var value = passwordInput.value.trim();
    if (!value) {
      showError("Password cannot be empty");
      return;
    }
    setBusy(passwordForm, true);
    post(API + "/auth/session", { "Authorization": "Bearer " + value })
      .then(function (data) { finish(data.token); })
      .catch(function (error) { showError(error.message); setBusy(passwordForm, false); });
  });

  totpForm.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();
    var value = totpInput.value.trim();
    if (!/^[0-9]{6}$/.test(value)) {
      showError("Enter a 6-digit code");
      return;
    }
    setBusy(totpForm, true);
    post(API + "/auth/login", { "X-TOTP-Code": value })
      .then(function (data) { finish(data.token); })
      .catch(function (error) { showError(error.message); setBusy(totpForm, false); });
  });

  toggle.addEventListener("click", function () {
    var visible = passwordInput.type === "text";
    passwordInput.type = visible ? "password" : "text";
    toggle.textContent = visible ? "Show" : "Hide";
    toggle.setAttribute("aria-label", visible ? "Show password" : "Hide password");
  });

  totpInput.addEventListener("input", function () {
    totpInput.value = totpInput.value.replace(/\D/g, "").slice(0, 6);
  });

  function selectTab(which) {
    var password = which === "password";
    document.getElementById("tab-password").setAttribute("aria-selected", String(password));
    document.getElementById("tab-totp").setAttribute("aria-selected", String(!password));
    passwordForm.classList.toggle("hidden", !password);
    totpForm.classList.toggle("hidden", password);
    clearError();
    (password ? passwordInput : totpInput).focus();
  }

  document.getElementById("tab-password").addEventListener("click", function () { selectTab("password"); });
  document.getElementById("tab-totp").addEventListener("click", function () { selectTab("totp"); });
})();
</script>
</body>
</html>
